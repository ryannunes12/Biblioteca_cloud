<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Livros - Open Library</title>
</head>

<body>

    <h1>Pesquisar Livros por Título</h1>
    
    <!-- Formulário de Busca -->
    <form id="searchForm" class="search-box">
        <input type="text" id="titleInput" placeholder="Digite o título do livro..." required>
        <button type="submit">Buscar</button>
    </form>

    <div id="loading" class="loading">Buscando livros... Por favor, aguarde.</div>
    <div id="results" class="results"></div>


    <script src="script.js"></script>

</body>
</html>
